                  mobileMenuOverlay.setAttribute('aria-hidden', 'true');
                  body.style.overflow = '';
                  setTimeout(() => {
                    if (!mobileMenuOverlay.classList.contains('is-active')) {
                      mobileMenuOverlay.style.display = 'none';
                    }
                  }, 400);
                }
              };

              mobileMenuOpenBtn.addEventListener('click', () => toggleMenu(true));
              mobileMenuCloseBtn.addEventListener('click', () => toggleMenu(false));

              mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                  toggleMenu(false);
                });
              });

              document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && mobileMenuOverlay.classList.contains('is-active')) {
                  toggleMenu(false);
                }
              });

              window.addEventListener('resize', () => {
                if (window.innerWidth > 767 && mobileMenuOverlay.classList.contains('is-active')) {
                  toggleMenu(false);
                }
              });
            })()
          });
        </script>
      </div>
    </div>
  </div>
</div>
